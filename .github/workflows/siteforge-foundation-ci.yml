name: SiteForge foundation CI

on:
  pull_request:
    paths:
      - 'siteforge/**'
      - '.github/workflows/siteforge-foundation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: siteforge
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: siteforge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Select Java 21 for Firestore Emulator
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - name: Run Firebase Auth and Firestore Emulator tests
        env:
          FIREBASE_PROJECT_ID: demo-siteforge
        run: npx firebase emulators:exec --only auth,firestore --project demo-siteforge --config firebase.emulator.json "npm run test -- tests/sessionEmulator.test.ts tests/firestoreEmulator.test.ts tests/draftConcurrency.test.ts tests/assetReservations.test.ts"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify generated layouts
        run: npm run test:e2e -- tests/e2e/generatedSite.spec.ts
